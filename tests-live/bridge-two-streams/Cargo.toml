[package]
name = "murmur-live-bridge-two-streams"
version = "0.1.0"
edition = "2021"

[dependencies]
murmur-live-harness = { path = "../harness" }
# Bridge key math only: ed25519 signer public keys + X25519 recipient
# public keys for the bridge configs (hex strings over the wire format).
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
