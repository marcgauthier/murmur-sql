[package]
name = "murmur-live-harness"
version = "0.1.0"
edition = "2021"

# Multi-process live harness: one murmur-server child per node, driven over
# the PostgreSQL wire protocol. It never links the engine or storage
# (servers are built once per process, or reused via MURMUR_SERVER_BIN);
# the murmur-replication path dep below is the wire-protocol/message
# implementation reused by the attacker fixture only.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
tokio-postgres = "0.7"
rcgen = "=0.13.2"
ed25519-dalek = "2"
thiserror = "2"
ipnet = "2"
rand = "0.8"
time = "0.3"
libc = "0.2"
# Raw-QUIC attacker fixture (`src/attacker.rs`): reuses the product
# wire-format/crypto implementation via path dep, never a fork. `quinn`,
# `sha2` and `zeroize` match the product's versions (see
# `replication/Cargo.toml`) because they appear in the product's public API
# (endpoint/streams, snapshot digests, TLS credentials).
murmur-replication = { path = "../../replication" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
sha2 = "0.10"
zeroize = "1"
