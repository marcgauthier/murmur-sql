[package]
name = "murmur-live-merge-policies"
version = "0.1.0"
edition = "2021"

[dependencies]
murmur-live-harness = { path = "../harness" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# OR_SET projections are postcard-encoded value vecs; decode with a local
# mirror of the product Value enum (same variant order, test-only).
postcard = "1"
serde = { version = "1", features = ["derive"] }
