[package]
name = "murmur-sql-bench"
version = "0.1.0"
edition = "2021"

# Standalone pgwire throughput benchmark (mirrors ../MURMUR/tests-benchmark
# over the PostgreSQL wire protocol). Not part of any workspace.

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
tokio-postgres = "0.7"
tempfile = "3"
