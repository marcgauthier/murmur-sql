[package]
name = "murmur-sql"
version = "0.1.0"
edition = "2024"

[features]
default = ["vector"]
replication = ["murmur/replication"]
vector = ["murmur/vector"]

[dependencies]
murmur = { package = "sqlite-session", path = "../MURMUR" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
toml = "1"
toml_edit = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros", "fs", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
pgwire = { version = "0.41", default-features = false, features = ["server-api-ring"] }
async-trait = "0.1"
futures = "0.3"
argon2 = "0.5"
password-hash = "0.5"
base64 = "0.22"
rustls-pemfile = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

serde = { version = "1", features = ["derive"] }
blake3 = "1"
zeroize = "1"
rand = "0.8"
serde_json = "1"

[[bin]]
name = "murmur-admin"
path = "src/bin/admin.rs"

[dev-dependencies]
tempfile = "3"
rcgen = "=0.13.2"
tokio-postgres = "0.7"
