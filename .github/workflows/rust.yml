name: Rust shell
on:
  push:
    paths: ['src/**', 'tests/**', 'Cargo.*', '.github/workflows/rust.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'Cargo.*', '.github/workflows/rust.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: macos-15
          - runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: murmur-sql
      # Sibling checkout for the `murmur` path dependency (`../MURMUR`).
      - uses: actions/checkout@v4
        with:
          repository: marcgauthier/murmur
          path: MURMUR
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Linux compiler dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev build-essential
      # No --locked anywhere: the sibling murmur checkout floats on its
      # default branch (same as the client workflows).
      - name: Default features
        working-directory: murmur-sql
        shell: bash
        run: cargo test
      - name: Replication features
        working-directory: murmur-sql
        shell: bash
        run: cargo test --features replication
      - name: All features
        working-directory: murmur-sql
        shell: bash
        run: cargo test --all-features
      - name: Clippy
        working-directory: murmur-sql
        shell: bash
        run: cargo clippy --all-targets
