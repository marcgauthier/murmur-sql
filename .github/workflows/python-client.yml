name: Python client
on:
  push:
    paths: ['clients/python/**', 'src/**', 'Cargo.*', '.github/workflows/python-client.yml']
  pull_request:
    paths: ['clients/python/**', 'src/**', 'Cargo.*', '.github/workflows/python-client.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
          - runner: macos-15-intel
          - runner: macos-15
          - runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: murmur-sql
      # Sibling checkout for the `murmur` path dependency (`../MURMUR`).
      - uses: actions/checkout@v4
        with:
          repository: marcgauthier/murmur
          path: MURMUR
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux compiler dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev build-essential
      - name: Build server binary
        working-directory: murmur-sql
        shell: bash
        # No --locked: the sibling murmur checkout floats on its default branch.
        run: |
          cargo build --features replication --bin murmur-server --bin murmur-admin
          echo "MURMUR_SERVER_BIN=${{ github.workspace }}/murmur-sql/target/debug/murmur-server${{ runner.os == 'Windows' && '.exe' || '' }}" >> $GITHUB_ENV
      - name: Install client
        working-directory: murmur-sql/clients/python
        run: pip install -e '.[test]'
      - name: Python tests and examples
        working-directory: murmur-sql/clients/python
        run: python -m pytest -q
