name: Service installation
on:
  push:
    paths: ['src/**', 'tests/service_*.rs', 'Cargo.*', '.github/workflows/service-installation.yml']
  pull_request:
    paths: ['src/**', 'tests/service_*.rs', 'Cargo.*', '.github/workflows/service-installation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: murmur-sql
    steps:
      - uses: actions/checkout@v4
        with:
          path: murmur-sql
      - uses: actions/checkout@v4
        with:
          repository: marcgauthier/murmur
          path: MURMUR
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev build-essential
      - name: Installer logic tests
        run: "cargo test --all-features --lib service::"
      - name: Console lifecycle and argument tests
        run: cargo test --all-features --test service_cli --test server_lifecycle
      # Hosted runners are disposable. These tests create/remove the real service;
      # they must never run on an existing Murmur-SQL deployment.
      - name: Elevated Linux service lifecycle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test_bin=$(cargo test --all-features --test service_installation --no-run --message-format=json | python3 -c 'import json,sys; a=[json.loads(s) for s in sys.stdin if s.startswith("{")]; b=[v["executable"] for v in a if v.get("reason")=="compiler-artifact" and v.get("target",{}).get("name")=="service_installation" and v.get("executable")]; assert len(b)==1,b; print(b[0])')
          sudo env MURMUR_SERVICE_TESTS=1 "$test_bin" --ignored --test-threads=1 --nocapture
      - name: Elevated Windows service lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MURMUR_SERVICE_TESTS: '1'
        run: |
          $artifacts = cargo test --all-features --test service_installation --no-run --message-format=json | ForEach-Object { $_ | ConvertFrom-Json }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bins = @($artifacts | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'service_installation' -and $_.executable })
          if ($bins.Count -ne 1) { throw 'Expected exactly one service integration test executable' }
          & $bins[0].executable --ignored --test-threads=1 --nocapture
          exit $LASTEXITCODE
